name: Kootenai collector validation

on:
  push:
    branches:
      - fix-kootenai-freshness-and-parser
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect Kootenai layout extraction
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from io import BytesIO
          from pypdf import PdfReader
          from idaho_permits.collectors.common import discover_links, get
          from idaho_permits.collectors.kootenai_county import ARCHIVE_URL

          links=discover_links(ARCHIVE_URL, ('WEEKLY BUILDING PERMIT REPORT','Weekly Building Permit Report'))
          reports=[]; seen=set()
          for label,url in links:
              if '/Archive/ViewFile/Item/' not in url or url in seen: continue
              seen.add(url); reports.append((label,url))
          label,url=reports[0]
          data=get(url,referer=ARCHIVE_URL).content
          reader=PdfReader(BytesIO(data))
          print('REPORT',label,url,'PAGES',len(reader.pages))
          for page_no,page in enumerate(reader.pages[:4], start=1):
              try:
                  text=page.extract_text(extraction_mode='layout') or ''
              except TypeError:
                  text=page.extract_text() or ''
              print('=== PAGE',page_no,'===')
              for line in text.splitlines():
                  if 'NEW SFR' in line.upper() or 'Permit Title:' in line or 'RES26-' in line or 'NEW ONE FAMILY' in line.upper():
                      print(repr(line))
          PY

name: Kootenai collector validation

on:
  push:
    branches:
      - fix-kootenai-freshness-and-parser
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live Kootenai reports
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.kootenai_county import KootenaiCountyCollector

          result=KootenaiCountyCollector().collect()
          print('SOURCE',result.source)
          print('SOURCE_URL',result.source_url)
          print('COUNT',len(result.permits))
          print('NOTE',result.note)
          numbers={p.permit_number for p in result.permits}
          for required in ('RES26-0064','RES26-0870','RES26-0971','RES26-1015','RES26-1201','RES26-1360','RES26-1437'):
              print('CONTROL',required,required in numbers)
              if required not in numbers:
                  raise SystemExit(f'missing latest-week Kootenai new-SFR control: {required}')
          if 'RES26-1342' in numbers:
              raise SystemExit('cancelled Kootenai SFR escaped parser guard')
          if '2026-08-30 through 2026-09-05' not in result.note:
              raise SystemExit(f'Kootenai reporting period is not explicit: {result.note}')
          if 'WARNING:' in result.note:
              raise SystemExit(f'current Kootenai report unexpectedly marked stale: {result.note}')

          kinds=Counter(); qualifying=[]
          for permit in result.permits:
              classify_permit(permit)
              kinds[permit.classification]+=1
              if permit.qualifies:
                  qualifying.append(permit)
          print('CLASSIFICATIONS',dict(kinds))
          print('QUALIFYING',len(qualifying))
          for permit in sorted(qualifying,key=lambda p:(p.issued_date,p.permit_number),reverse=True)[:40]:
              print('PERMIT',permit.permit_number,permit.issued_date,permit.classification,permit.project_name,permit.address,permit.valuation,permit.contractor)
          if len(qualifying) < 15:
              raise SystemExit(f'Kootenai six-week pull produced unexpectedly few qualifying leads: {len(qualifying)}')
          PY

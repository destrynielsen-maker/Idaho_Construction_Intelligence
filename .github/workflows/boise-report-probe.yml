name: Boise public report probe

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe Boise anonymous Building search
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          url='https://permits.cityofboise.org/CitizenAccess/Cap/CapHome.aspx?module=Building'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; IdahoConstructionIntelligence/0.1; public-permit-research)'})
          r=s.get(url,timeout=90)
          print('GET',r.status_code,r.url,'LEN',len(r.text))
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          form=soup.find('form',id='aspnetForm')
          print('FORM',bool(form),form.get('action') if form else None)
          for tag in (form.find_all(['input','select','textarea']) if form else []):
              name=tag.get('name') or ''
              ident=tag.get('id') or ''
              if any(k in (name+' '+ident).lower() for k in ['general','gs','status','permit','type','date','search']):
                  opts=[]
                  if tag.name=='select':
                      opts=[(' '.join(o.get_text(' ',strip=True).split()),o.get('value',''),o.has_attr('selected')) for o in tag.find_all('option')]
                  print('FIELD',tag.name,ident,name,repr(tag.get('value','')),'OPTS',opts[:120])
          for table in soup.find_all('table'):
              ident=table.get('id') or ''
              if 'permit' in ident.lower() or 'grid' in ident.lower():
                  print('TABLE',ident)
          text=' '.join(soup.stripped_strings)
          print('HAS_NO_RESULTS',bool(re.search(r'no records|no results|0 record',text,re.I)))

          def controls(sp):
              f=sp.find('form',id='aspnetForm')
              d={}
              for e in f.find_all('input') if f else []:
                  n=e.get('name'); typ=(e.get('type') or 'text').lower()
                  if not n or typ in {'submit','button','image','file'}: continue
                  if typ in {'checkbox','radio'} and not e.has_attr('checked'): continue
                  d[n]=e.get('value','')
              for e in f.find_all('textarea') if f else []:
                  if e.get('name'): d[e['name']]=e.get_text()
              for e in f.find_all('select') if f else []:
                  n=e.get('name')
                  if not n: continue
                  ch=e.find('option',selected=True) or e.find('option')
                  d[n]=ch.get('value','') if ch else ''
              return d

          payload=controls(soup)
          payload.update({
              '__EVENTTARGET':'ctl00$PlaceHolderMain$btnNewSearch',
              '__EVENTARGUMENT':'',
              'ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate':'08/18/2026',
              'ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate':'08/25/2026',
              'ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate_ext_ClientState':'',
              'ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate_ext_ClientState':'',
              'ctl00$PlaceHolderMain$generalSearchForm$ddlGSPermitType':'',
              'ctl00$PlaceHolderMain$generalSearchForm$ddlGSStatus':'Issued',
          })
          p=s.post(url,data=payload,headers={'Referer':url,'Origin':'https://permits.cityofboise.org'},timeout=120)
          print('POST',p.status_code,p.url,'LEN',len(p.text))
          p.raise_for_status()
          ps=BeautifulSoup(p.text,'html.parser')
          for table in ps.find_all('table'):
              ident=table.get('id') or ''
              if 'permit' in ident.lower() or 'grid' in ident.lower():
                  rows=table.find_all('tr')
                  print('RESULT_TABLE',ident,'ROWS',len(rows))
                  for tr in rows[:12]:
                      print('ROW',' | '.join(' '.join(x.stripped_strings) for x in tr.find_all(['th','td'])))
          plain=' '.join(ps.stripped_strings)
          print('RESULT_NO_RECORDS',bool(re.search(r'no records|no results|0 record',plain,re.I)))
          for a in ps.find_all('a',href=True):
              txt=' '.join(a.stripped_strings)
              if re.search(r'(?:BLD|RES|COM|BP)\w*[- ]?\d',txt,re.I) or txt=='Next >':
                  print('RESULT_LINK',repr(txt),a.get('id'),a.get('href'))
          PY

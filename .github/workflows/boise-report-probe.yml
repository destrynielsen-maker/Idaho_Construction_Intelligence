name: Boise commercial quality probe

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect Boise 502 issued borderline rows
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          search='https://permits.cityofboise.org/CitizenAccess/Cap/CapHome.aspx?module=Building'
          wanted={'BLD26-01687','BLD26-01423','BLD26-00239'}
          type_name='ctl00$PlaceHolderMain$generalSearchForm$ddlGSPermitType'
          status_name='ctl00$PlaceHolderMain$generalSearchForm$ddlGSCapStatus'
          type_value='Building/Building/502-New or Added Commercial/NA'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; IdahoConstructionIntelligence/0.1; public-permit-research)'})

          def controls(sp):
              f=sp.find('form',id='aspnetForm'); out={}
              for e in f.find_all('input') if f else []:
                  n=e.get('name'); typ=(e.get('type') or 'text').lower()
                  if not n or typ in {'submit','button','image','file'} or (typ in {'checkbox','radio'} and not e.has_attr('checked')): continue
                  out[n]=e.get('value','')
              for e in f.find_all('textarea') if f else []:
                  if e.get('name'): out[e['name']]=e.get_text()
              for e in f.find_all('select') if f else []:
                  n=e.get('name'); ch=e.find('option',selected=True) or e.find('option')
                  if n: out[n]=ch.get('value','') if ch else ''
              return out

          r=s.get(search,timeout=60); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          data=controls(soup); data[type_name]=type_value; data['__EVENTTARGET']=type_name; data['__EVENTARGUMENT']=''
          p=s.post(search,data=data,headers={'Referer':search,'Origin':'https://permits.cityofboise.org'},timeout=90); p.raise_for_status(); soup=BeautifulSoup(p.text,'html.parser')
          data=controls(soup)
          data.update({type_name:type_value,status_name:'Issued','ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate':'01/01/2026','ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate':'08/25/2026','ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate_ext_ClientState':'','ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate_ext_ClientState':'','__EVENTTARGET':'ctl00$PlaceHolderMain$btnNewSearch','__EVENTARGUMENT':''})
          q=s.post(search,data=data,headers={'Referer':search,'Origin':'https://permits.cityofboise.org'},timeout=120); q.raise_for_status(); soup=BeautifulSoup(q.text,'html.parser')

          found={}
          for page in range(30):
              table=soup.find('table',id='ctl00_PlaceHolderMain_dgvPermitList_gdvPermitList')
              if not table: break
              for tr in table.find_all('tr'):
                  link=tr.find('a',id=re.compile(r'_hlPermitNumber$'))
                  if not link: continue
                  number=' '.join(link.stripped_strings).strip()
                  if number in wanted:
                      row=' | '.join(' '.join(td.stripped_strings) for td in tr.find_all('td'))
                      found[number]=(urljoin(search,link.get('href','')),row)
                      print('ROW',number,row[:2500])
              if wanted.issubset(found): break
              next_link=next((a for a in soup.find_all('a',href=True) if ' '.join(a.stripped_strings).strip()=='Next >'),None)
              if not next_link: break
              m=re.search(r"__doPostBack\('([^']*)','([^']*)'\)",next_link.get('href',''))
              if not m: break
              pd=controls(soup); pd['__EVENTTARGET']=m.group(1); pd['__EVENTARGUMENT']=m.group(2)
              nxt=s.post(search,data=pd,headers={'Referer':search,'Origin':'https://permits.cityofboise.org'},timeout=120); nxt.raise_for_status(); soup=BeautifulSoup(nxt.text,'html.parser')

          print('FOUND_NUMBERS',sorted(found))
          for number,(detail_url,row) in found.items():
              d=s.get(detail_url,headers={'Referer':search},timeout=60); d.raise_for_status(); ds=BeautifulSoup(d.text,'html.parser'); text=' '.join(ds.stripped_strings)
              print('DETAIL_URL',number,detail_url)
              for label,pat in [
                  ('PROJECT',r'Project Description:\s*(.+?)(?=\s+More Details)'),
                  ('RECEIVED',r'Received Date:\s*(\d{1,2}/\d{1,2}/\d{4})'),
                  ('ISSUED',r'Issued Date:\s*(\d{1,2}/\d{1,2}/\d{4})'),
                  ('APPLICATION_TYPE',r'Application Type:\s*(.+?)(?=\s+Does this application|\s+Type of Construction|\s+Type of Permit:)'),
                  ('TYPE_PERMIT',r'Type of Permit:\s*(.+?)(?=\s+Type of Use:)'),
                  ('TYPE_USE',r'Type of Use:\s*(.+?)(?=\s+Type of Work:)'),
                  ('TYPE_WORK',r'Type of Work:\s*(.+?)(?=\s+(?:Building Height|Existing Building Area|New Building Area|Total Building Area|Additional Features))'),
                  ('EXISTING_AREA',r'Existing Building Area:\s*([\d,.]+)'),
                  ('NEW_AREA',r'New Building Area:\s*([\d,.]+)'),
                  ('TOTAL_AREA',r'Total Building Area:\s*([\d,.]+)'),
                  ('VALUE',r'(?:Total Project Value|Initial Value):\s*\$?([\d,.]+)'),
              ]:
                  m=re.search(pat,text,re.I)
                  print(label,number,m.group(1).strip()[:1800] if m else None)
          PY

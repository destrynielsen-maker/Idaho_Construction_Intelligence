name: Boise public report probe

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe Boise Accela reports
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          base='https://permits.cityofboise.org/CitizenAccess/'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; IdahoConstructionIntelligence/0.1; public-permit-research)'})
          r=s.get(urljoin(base,'Default.aspx?TabName=Home'),timeout=60)
          print('HOME',r.status_code,r.url,'LEN',len(r.text))
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          form=soup.find('form')
          data={}
          for inp in form.find_all('input') if form else []:
              name=inp.get('name')
              if name:
                  data[name]=inp.get('value','')
          data['__EVENTTARGET']='ctl00$HeaderNavigation$btnPostForReport'
          data['__EVENTARGUMENT']=''
          action=urljoin(r.url,form.get('action') if form else 'Welcome.aspx?TabName=Home')
          p=s.post(action,data=data,headers={'Referer':r.url},timeout=60,allow_redirects=True)
          print('POST',p.status_code,p.url,'LEN',len(p.text),'CTYPE',p.headers.get('content-type'))
          p.raise_for_status()
          ps=BeautifulSoup(p.text,'html.parser')
          for a in ps.find_all('a',href=True):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=a['href']
              low=(text+' '+href).lower()
              if any(x in low for x in ['report','issued building','building permits issued','occupancy','received']):
                  print('LINK',repr(text),urljoin(p.url,href))
          for tag in ps.find_all(['input','button']):
              blob=' '.join([str(tag.get('id') or ''),str(tag.get('name') or ''),str(tag.get('value') or ''),tag.get_text(' ',strip=True)])
              if any(x in blob.lower() for x in ['report','issued building','building permits issued','occupancy']):
                  print('CONTROL',blob[:500])
          text=p.text
          for needle in ['Building Permits Issued','Issued Building Permits','Occupancy Report','Report.aspx','reportID','ReportID','btnPostForReport']:
              start=0
              hits=0
              while hits<10:
                  idx=text.find(needle,start)
                  if idx<0: break
                  print('CTX',needle,re.sub(r'\s+',' ',text[max(0,idx-600):idx+1400]))
                  start=idx+len(needle)
                  hits+=1
          PY

name: Boise issued permit validation

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run live Boise issued collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import date, timedelta
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.boise import BoiseIssuedPermitCollector

          collector=BoiseIssuedPermitCollector()
          permits=collector.collect()
          print('SOURCE',permits.source)
          print('COUNT',len(permits.permits))
          kinds=Counter()
          for p in permits.permits:
              classify_permit(p)
              kinds[p.classification]+=1
              print('PERMIT',p.permit_number,p.issued_date,p.classification,p.project_name,p.address,p.valuation,p.contractor)
              if not p.qualifies:
                  raise SystemExit('nonqualifying permit escaped source filter: '+p.permit_number)
              issued=date.fromisoformat(p.issued_date)
              if issued < date.today()-timedelta(days=collector.lookback_days) or issued > date.today():
                  raise SystemExit('issue date outside production window: '+p.permit_number)
              if p.status != 'Issued':
                  raise SystemExit('non-issued record escaped source filter: '+p.permit_number)
          print('CLASSIFICATIONS',dict(kinds))
          if not permits.permits:
              raise SystemExit('Boise issued collector returned no qualifying permits')
          PY

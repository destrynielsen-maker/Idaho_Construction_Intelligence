name: Boise commercial quality probe

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect borderline Boise commercial permits
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          search='https://permits.cityofboise.org/CitizenAccess/Cap/CapHome.aspx?module=Building'
          numbers=['BLD26-01687','BLD26-01423','BLD26-00239']
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; IdahoConstructionIntelligence/0.1; public-permit-research)'})

          def controls(sp):
              f=sp.find('form',id='aspnetForm'); out={}
              for e in f.find_all('input') if f else []:
                  n=e.get('name'); typ=(e.get('type') or 'text').lower()
                  if not n or typ in {'submit','button','image','file'} or (typ in {'checkbox','radio'} and not e.has_attr('checked')): continue
                  out[n]=e.get('value','')
              for e in f.find_all('textarea') if f else []:
                  if e.get('name'): out[e['name']]=e.get_text()
              for e in f.find_all('select') if f else []:
                  n=e.get('name'); ch=e.find('option',selected=True) or e.find('option')
                  if n: out[n]=ch.get('value','') if ch else ''
              return out

          for number in numbers:
              r=s.get(search,timeout=60); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
              data=controls(soup)
              data.update({
                  '__EVENTTARGET':'ctl00$PlaceHolderMain$btnNewSearch',
                  '__EVENTARGUMENT':'',
                  'ctl00$PlaceHolderMain$generalSearchForm$txtGSPermitNumber':number,
                  'ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate':'01/01/2025',
                  'ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate':'08/25/2026',
                  'ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate_ext_ClientState':'',
                  'ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate_ext_ClientState':'',
              })
              p=s.post(search,data=data,headers={'Referer':search,'Origin':'https://permits.cityofboise.org'},timeout=90); p.raise_for_status(); ps=BeautifulSoup(p.text,'html.parser')
              link=ps.find('a',id=re.compile(r'_hlPermitNumber$'),string=re.compile('^'+re.escape(number)+'$'))
              if not link:
                  link=next((a for a in ps.find_all('a',id=re.compile(r'_hlPermitNumber$')) if ' '.join(a.stripped_strings).strip()==number),None)
              print('FOUND',number,bool(link))
              if not link: continue
              detail_url=urljoin(search,link.get('href',''))
              d=s.get(detail_url,headers={'Referer':search},timeout=60); d.raise_for_status(); ds=BeautifulSoup(d.text,'html.parser')
              text=' '.join(ds.stripped_strings)
              print('DETAIL_URL',number,detail_url)
              for label,pat in [
                  ('STATUS',r'Record Status:\s*(.+?)(?=\s+Add to Existing Project|\s+Record Info)'),
                  ('PROJECT',r'Project Description:\s*(.+?)(?=\s+More Details)'),
                  ('RECEIVED',r'Received Date:\s*(\d{1,2}/\d{1,2}/\d{4})'),
                  ('ISSUED',r'Issued Date:\s*(\d{1,2}/\d{1,2}/\d{4})'),
                  ('APPLICATION_TYPE',r'Application Type:\s*(.+?)(?=\s+Does this application|\s+Type of Construction|\s+Type of Permit:)'),
                  ('TYPE_PERMIT',r'Type of Permit:\s*(.+?)(?=\s+Type of Use:)'),
                  ('TYPE_USE',r'Type of Use:\s*(.+?)(?=\s+Type of Work:)'),
                  ('TYPE_WORK',r'Type of Work:\s*(.+?)(?=\s+(?:Building Height|Existing Building Area|New Building Area|Total Building Area|Additional Features))'),
                  ('EXISTING_AREA',r'Existing Building Area:\s*([\d,.]+)'),
                  ('NEW_AREA',r'New Building Area:\s*([\d,.]+)'),
                  ('TOTAL_AREA',r'Total Building Area:\s*([\d,.]+)'),
                  ('VALUE',r'(?:Total Project Value|Initial Value):\s*\$?([\d,.]+)'),
              ]:
                  m=re.search(pat,text,re.I)
                  print(label,number,m.group(1).strip()[:1600] if m else None)
          PY

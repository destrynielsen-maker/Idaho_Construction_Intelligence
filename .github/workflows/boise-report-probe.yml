name: Boise public report probe

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Follow Boise Accela report outputs
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          base='https://permits.cityofboise.org/CitizenAccess/'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; IdahoConstructionIntelligence/0.1; public-permit-research)'})
          home=s.get(urljoin(base,'Default.aspx?TabName=Home'),timeout=60)
          home.raise_for_status()
          reports={
              406: {'dates':('Date_403','Date_401'),'extra':{'Number_402':'0'}},
              419: {'dates':('Date_427','Date_425'),'extra':{'Number_426':'0'}},
              928: {'dates':('Date_1084','Date_1083'),'extra':{}},
          }
          for report_id,cfg in reports.items():
              param=urljoin(base,f'Report/ReportParameter.aspx?module=&reportID={report_id}&reportType=LINK_REPORT_LIST')
              r=s.get(param,headers={'Referer':home.url},timeout=60)
              r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              form=soup.find('form')
              data={}
              for inp in form.find_all('input') if form else []:
                  name=inp.get('name')
                  if name:
                      data[name]=inp.get('value','')
              sf,ef=cfg['dates']
              data[sf]='08/18/2026'
              data[ef]='08/25/2026'
              data.update(cfg['extra'])
              data['Submit']='Submit'
              p=s.post(urljoin(r.url,form.get('action') if form else r.url),data=data,headers={'Referer':r.url},timeout=120)
              p.raise_for_status()
              show=urljoin(p.url,f'ShowReport.aspx?module=&reportID={report_id}&reportType=LINK_REPORT_LIST')
              out=s.get(show,headers={'Referer':p.url},timeout=180,allow_redirects=True)
              raw=out.content
              ctype=(out.headers.get('content-type') or '').lower()
              print('OUTPUT',report_id,'STATUS',out.status_code,'URL',out.url,'CTYPE',out.headers.get('content-type'),'CD',out.headers.get('content-disposition'),'LEN',len(raw),'MAGIC',raw[:32].hex())
              if 'html' in ctype or 'text' in ctype:
                  text=out.text
                  print('TEXT_HEAD',report_id,' '.join(text[:1600].split()))
                  osoup=BeautifulSoup(text,'html.parser')
                  for tag in osoup.find_all(['iframe','embed','object','a','form','script']):
                      vals=[]
                      for attr in ['src','href','data','action']:
                          v=tag.get(attr)
                          if v:
                              vals.append((attr,urljoin(out.url,v)))
                      label=' '.join(tag.get_text(' ',strip=True).split())[:160]
                      if vals or any(x in label.lower() for x in ['download','export','excel','pdf']):
                          print('TAG',report_id,tag.name,vals,repr(label))
                  for needle in ['ReportViewer','ReportResult','Export','Download','Excel','PDF','iframe','FileName','SessionID','ReportID','GetReport','ShowReport']:
                      start=0
                      hits=0
                      while hits<8:
                          idx=text.find(needle,start)
                          if idx<0: break
                          print('CTX',report_id,needle,re.sub(r'\s+',' ',text[max(0,idx-500):idx+1500]))
                          start=idx+len(needle)
                          hits+=1
          PY

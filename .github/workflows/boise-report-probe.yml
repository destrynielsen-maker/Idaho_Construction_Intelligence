name: Boise final validation

on:
  push:
    branches:
      - fix-boise-public-issued-permits
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final Boise patch
        run: |
          python scripts/finalize_boise_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/idaho_permits/collectors/boise.py tests/test_boise_collector.py
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Harden Boise commercial new-construction guards [skip ci]"
          git push

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run full Idaho pipeline
        env:
          PYTHONPATH: src
          SITE_BASE_URL: https://destrynielsen-maker.github.io/Idaho_Construction_Intelligence/
        run: |
          start=$(date +%s)
          python -m idaho_permits.main
          end=$(date +%s)
          echo "FULL_PIPELINE_SECONDS=$((end-start))"

      - name: Validate Boise and statewide outputs
        run: python scripts/validate_boise_pipeline.py

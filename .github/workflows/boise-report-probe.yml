name: Boise public report probe

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect Boise search date controls
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://permits.cityofboise.org/CitizenAccess/Cap/CapHome.aspx?module=Building'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; IdahoConstructionIntelligence/0.1; public-permit-research)'})
          r=s.get(url,timeout=60); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          form=soup.find('form',id='aspnetForm')
          for tag in form.find_all(['select','input','span','label']) if form else []:
              ident=tag.get('id') or ''; name=tag.get('name') or ''; title=tag.get('title') or ''; text=' '.join(tag.stripped_strings)
              blob=' '.join([ident,name,title,text]).lower()
              if 'date' not in blob and 'issued' not in blob:
                  continue
              opts=[]
              if tag.name=='select':
                  opts=[(' '.join(o.stripped_strings),o.get('value',''),o.has_attr('selected')) for o in tag.find_all('option')]
              print('CONTROL',tag.name,ident,name,'VALUE',repr(tag.get('value','')),'TEXT',repr(text[:300]),'ATTRS',dict(tag.attrs),'OPTS',opts[:100])
          PY

name: Boise public report probe

on:
  push:
    branches: [fix-boise-public-issued-permits]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Submit Boise Accela reports
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          base='https://permits.cityofboise.org/CitizenAccess/'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; IdahoConstructionIntelligence/0.1; public-permit-research)'})
          home=s.get(urljoin(base,'Default.aspx?TabName=Home'),timeout=60)
          home.raise_for_status()

          reports={
              406: {'dates':('Date_403','Date_401'),'extra':{'Number_402':'0'}},
              419: {'dates':('Date_427','Date_425'),'extra':{'Number_426':'0'}},
              928: {'dates':('Date_1084','Date_1083'),'extra':{}},
          }
          for report_id,cfg in reports.items():
              url=urljoin(base,f'Report/ReportParameter.aspx?module=&reportID={report_id}&reportType=LINK_REPORT_LIST')
              r=s.get(url,headers={'Referer':home.url},timeout=60)
              r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              form=soup.find('form')
              data={}
              for inp in form.find_all('input') if form else []:
                  name=inp.get('name')
                  if name:
                      data[name]=inp.get('value','')
              start_field,end_field=cfg['dates']
              data[start_field]='08/18/2026'
              data[end_field]='08/25/2026'
              data.update(cfg['extra'])
              data['Submit']='Submit'
              action=urljoin(r.url,form.get('action') if form else r.url)
              p=s.post(action,data=data,headers={'Referer':r.url},timeout=120,allow_redirects=True)
              raw=p.content
              print('SUBMIT',report_id,'STATUS',p.status_code,'URL',p.url,'CTYPE',p.headers.get('content-type'),'CD',p.headers.get('content-disposition'),'LEN',len(raw),'MAGIC',raw[:24].hex())
              if 'text' in (p.headers.get('content-type') or '').lower() or 'html' in (p.headers.get('content-type') or '').lower():
                  text=p.text
                  print('TEXT_HEAD',report_id,' '.join(text[:1200].split()))
                  for needle in ['Download','Export','ReportViewer','File','Excel','PDF','window.open','location.href','ReportResult','ReportPreview']:
                      idx=text.find(needle)
                      if idx>=0:
                          print('CTX',report_id,needle,re.sub(r'\s+',' ',text[max(0,idx-500):idx+1600]))
          PY

name: Twin Falls County two-period source review (read only)
on:
  push:
    branches: [independent/twin-falls-county-intake]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_county*.py' -v
      - run: PYTHONPATH=src python scripts/review_twin_falls_county_sources.py

      - run: pip install pdfplumber==0.11.4
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_twin_falls_pdf_layout.py' -v
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_twin_falls_candidate_review.py' -v
      - run: PYTHONPATH=src python scripts/review_twin_falls_automated_pdf.py

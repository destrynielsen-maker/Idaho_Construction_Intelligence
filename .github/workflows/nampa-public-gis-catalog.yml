name: Nampa official public GIS catalog discovery (read only)
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/nampa_public_gis_catalog.py'
      - '.github/workflows/nampa-public-gis-catalog.yml'
permissions:
  contents: read
jobs:
  discover:
    if: github.head_ref == 'independent/nampa-public-gis-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/nampa_public_gis_catalog.py

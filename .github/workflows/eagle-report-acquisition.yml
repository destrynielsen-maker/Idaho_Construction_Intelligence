name: Eagle official report acquisition (no deployment)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/eagle_public_report_acquisition.py'
      - '.github/workflows/eagle-report-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'independent/eagle-official-report-acquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded public-report acquisition dependencies
        run: |
          python -m pip install requests==2.32.5 playwright==1.57.0
          command -v google-chrome
          command -v pdftotext
      - name: Acquire official PDF through normal public archive controls
        run: python scripts/eagle_public_report_acquisition.py

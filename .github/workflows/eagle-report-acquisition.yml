name: Eagle official report acquisition (no deployment)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/eagle_public_report_acquisition.py'
      - 'scripts/eagle_report_parser.py'
      - 'scripts/eagle_report_replay.py'
      - 'src/idaho_permits/collectors/eagle*.py'
      - 'src/idaho_permits/reporting.py'
      - '.github/workflows/collect-and-publish.yml'
      - '.github/workflows/eagle-report-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'independent/eagle-official-report-acquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded public-report acquisition dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.57.0 pdfplumber==0.11.8
          command -v google-chrome
      - name: Acquire official PDF through normal public archive controls
        run: python scripts/eagle_public_report_acquisition.py --output "$RUNNER_TEMP/eagle-reports.json"
      - name: Run unchanged production classifier and history-safe replay
        env:
          PYTHONPATH: src
        run: python scripts/eagle_report_replay.py "$RUNNER_TEMP/eagle-reports.json"
      - name: Run full repository tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

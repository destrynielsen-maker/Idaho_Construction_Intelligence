name: Coeur d'Alene collector validation

on:
  push:
    branches:
      - fix-cda-current-issued-permits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live Coeur d'Alene rolling report
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.coeur_dalene import CoeurDAleneCollector

          result=CoeurDAleneCollector().collect()
          print('SOURCE',result.source)
          print('SOURCE_URL',result.source_url)
          print('COUNT',len(result.permits))
          print('NOTE',result.note)
          numbers={p.permit_number for p in result.permits}
          required=(
              '151560-B','151559-B','151561-B','151488-B',
              '152271-B','152272-B','152274-B','152695-B',
          )
          for permit_number in required:
              print('CONTROL',permit_number,permit_number in numbers)
              if permit_number not in numbers:
                  raise SystemExit(f'missing Coeur d\'Alene new-construction control: {permit_number}')
          if any(not n.endswith('-B') for n in numbers):
              raise SystemExit('non-primary Coeur d\'Alene child permit escaped primary-building guard')

          kinds=Counter(); qualifying=[]
          for permit in result.permits:
              classify_permit(permit)
              kinds[permit.classification]+=1
              if permit.qualifies:
                  qualifying.append(permit)
          print('CLASSIFICATIONS',dict(kinds))
          print('QUALIFYING',len(qualifying))
          for permit in sorted(qualifying,key=lambda p:(p.issued_date,p.permit_number),reverse=True):
              print('PERMIT',permit.permit_number,permit.issued_date,permit.classification,permit.project_name,permit.address,permit.valuation,permit.contractor,permit.building_use)
          if len(qualifying) != 8:
              raise SystemExit(f'expected 8 current primary Coeur d\'Alene qualifying leads, got {len(qualifying)}')
          if not all(p.issued_date.startswith('2026-') for p in result.permits):
              raise SystemExit('Coeur d\'Alene issued dates are not normalized to ISO format')
          if not any('Town House' == (p.building_use or '') for p in qualifying):
              raise SystemExit('Town House source type was not preserved')
          PY

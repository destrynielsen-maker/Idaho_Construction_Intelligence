name: Coeur d'Alene collector validation

on:
  push:
    branches:
      - fix-cda-current-issued-permits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect Coeur d'Alene issued report form
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url='https://building.cdaid.org/Reports/IssuedPermits'
          s=requests.Session()
          r=s.get(url,timeout=30)
          r.raise_for_status()
          print('GET',r.status_code,r.url,r.headers.get('content-type'))
          soup=BeautifulSoup(r.text,'html.parser')
          for f in soup.find_all('form'):
              print('FORM',f.get('method'),f.get('action'))
              for inp in f.find_all(['input','button','select']):
                  print('FIELD',inp.name,inp.get('type'),inp.get('name'),inp.get('value'),inp.get('id'))

          candidates=[
              {'StartDate':'08/01/2026','EndDate':'09/11/2026'},
              {'startDate':'08/01/2026','endDate':'09/11/2026'},
              {'Start':'08/01/2026','End':'09/11/2026'},
          ]
          for data in candidates:
              for method in ('get','post'):
                  try:
                      resp=getattr(s,method)(url,params=data if method=='get' else None,data=data if method=='post' else None,timeout=45,allow_redirects=True)
                      print('TRY',method,data,'STATUS',resp.status_code,'URL',resp.url,'CTYPE',resp.headers.get('content-type'),'LEN',len(resp.content),'PDF',resp.content[:4]==b'%PDF')
                      print('DISP',resp.headers.get('content-disposition'))
                  except Exception as exc:
                      print('TRY_ERROR',method,data,type(exc).__name__,str(exc)[:200])
          PY

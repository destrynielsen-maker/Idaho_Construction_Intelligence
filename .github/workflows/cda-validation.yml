name: Coeur d'Alene collector validation

on:
  push:
    branches:
      - fix-cda-current-issued-permits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect 45-day Coeur d'Alene issued permits
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import re,requests
          from collections import Counter
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.coeur_dalene import parse
          from idaho_permits.collectors.common import pdf_text

          url='https://building.cdaid.org/Reports/IssuedPermits'
          r=requests.post(url,data={'StartDate':'07/29/2026','EndDate':'09/11/2026'},timeout=60)
          r.raise_for_status()
          print('CTYPE',r.headers.get('content-type'),'LEN',len(r.content),'PDF',r.content[:4]==b'%PDF')
          text=pdf_text(r.content)
          rows=parse(text,url)
          print('PARSED',len(rows))
          kinds=Counter()
          for p in rows:
              classify_permit(p)
              kinds[(p.classification,p.qualifies)] += 1
              low=' '.join(filter(None,[p.permit_type,p.project_name])).lower()
              if p.qualifies or any(x in low for x in ('new ','duplex','triplex','fourplex','townhome','townhouse','apartment','commercial shell','single family')):
                  print('CANDIDATE',p.permit_number,p.issued_date,p.permit_type,p.project_name,p.address,p.valuation,p.contractor,p.classification,p.qualifies)
          print('COUNTS',dict(kinds))
          lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]
          for i,line in enumerate(lines):
              low=line.lower()
              if any(x in low for x in ('project: new','project: duplex','project: triplex','project: fourplex','project: town','project: apartment','project: adu')):
                  print('RAW',i,repr(' | '.join(lines[max(0,i-2):min(len(lines),i+5)])))
          PY

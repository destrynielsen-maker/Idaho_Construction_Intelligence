name: Meridian extraction probe

on:
  push:
    branches:
      - fix-meridian-current-report-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect latest Meridian PDF extraction
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import re
          from idaho_permits.collectors.common import get,pdf_text
          url='https://data.meridiancity.org/media/gx5ghq1k/weekly-report-8-31-thru-9-6.pdf'
          text=pdf_text(get(url,referer='https://data.meridiancity.org/community-development/building/construction-reports/').content)
          lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]
          for i,line in enumerate(lines):
              if 'C-MULTI-2026-0008' in line or 'C-NEW-2026-0027' in line or re.match(r'^(COMMERCIAL|RESIDENTIAL)',line,re.I):
                  print('MATCH_INDEX',i,repr(line))
                  for j in range(max(0,i-4),min(len(lines),i+10)):
                      print(j,repr(lines[j]))
                  print('---')
          PY

name: Meridian collector validation

on:
  push:
    branches:
      - fix-meridian-current-report-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live Meridian reports
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.report_pages import MeridianDirectCollector

          collector=MeridianDirectCollector()
          result=collector.collect()
          print('SOURCE',result.source)
          print('COUNT',len(result.permits))
          print('NOTE',result.note)
          numbers={p.permit_number for p in result.permits}
          print('HAS_CENTREPOINT','C-MULTI-2026-0008' in numbers)
          print('HAS_OUTERBANKS','C-NEW-2026-0027' in numbers)
          if 'C-MULTI-2026-0008' not in numbers:
              raise SystemExit('missing Centrepoint Apartments September control')
          if 'C-NEW-2026-0027' not in numbers:
              raise SystemExit('missing Outerbanks Clubhouse September control')
          if '2026-08-31 through 2026-09-06' not in result.note:
              raise SystemExit('newest Meridian fallback report was not fetched')
          if 'WARNING:' in result.note:
              raise SystemExit('current Meridian fallback unexpectedly marked stale')

          kinds=Counter()
          qualifying=[]
          for permit in result.permits:
              classify_permit(permit)
              kinds[permit.classification]+=1
              if permit.qualifies:
                  qualifying.append(permit)
          print('CLASSIFICATIONS',dict(kinds))
          print('QUALIFYING',len(qualifying))
          for permit in sorted(qualifying,key=lambda p:(p.issued_date,p.permit_number),reverse=True)[:20]:
              print('PERMIT',permit.permit_number,permit.issued_date,permit.classification,permit.project_name,permit.address,permit.valuation,permit.contractor)
          if len(qualifying) <= 37:
              raise SystemExit(f'Meridian qualifying count did not improve over stale baseline: {len(qualifying)}')
          PY

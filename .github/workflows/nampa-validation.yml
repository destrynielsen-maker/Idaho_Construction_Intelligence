name: Nampa extraction probe

on:
  push:
    branches:
      - fix-nampa-current-report-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect latest Nampa PDF extraction
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import re
          from idaho_permits.collectors.common import get,pdf_text

          url='https://www.cityofnampa.us/DocumentCenter/View/20813/Weekly-Permit-Activity-Report-08-31-2026---09-04-2026'
          text=pdf_text(get(url,referer='https://www.cityofnampa.us/427/Permit-Reports').content)
          lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]
          for i,line in enumerate(lines):
              if 'COM-05510-2026' in line or 'COM-05512-2026' in line or 'RES-18696-2026' in line or line.startswith('Project Type:') or line.startswith('Structure Use:'):
                  print('MATCH_INDEX',i,repr(line))
                  for j in range(max(0,i-5),min(len(lines),i+16)):
                      print(j,repr(lines[j]))
                  print('---')
          PY

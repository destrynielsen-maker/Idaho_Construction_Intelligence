name: Nampa collector validation

on:
  push:
    branches:
      - fix-nampa-current-report-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live Nampa report
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.nampa import NampaPermitCollector

          result=NampaPermitCollector().collect()
          print('SOURCE',result.source)
          print('SOURCE_URL',result.source_url)
          print('COUNT',len(result.permits))
          print('NOTE',result.note)
          numbers={p.permit_number for p in result.permits}
          print('HAS_NEW_COMMERCIAL','COM-05510-2026' in numbers)
          print('HAS_NEW_SFD','RES-18696-2026' in numbers)
          print('HAS_ADDITION','COM-05512-2026' in numbers)
          if '/20813/' not in result.source_url:
              raise SystemExit(f'latest Nampa report was not selected: {result.source_url}')
          if '08/31/2026' not in result.note or '09/04/2026' not in result.note:
              raise SystemExit(f'latest Nampa report label missing: {result.note}')
          if 'WARNING:' in result.note:
              raise SystemExit(f'current Nampa report unexpectedly marked stale: {result.note}')
          if 'COM-05510-2026' not in numbers:
              raise SystemExit('missing new Nampa commercial control')
          if 'RES-18696-2026' not in numbers:
              raise SystemExit('missing new Nampa SFD control')
          if 'COM-05512-2026' in numbers:
              raise SystemExit('Nampa cooler addition escaped new-construction guard')

          kinds=Counter(); qualifying=[]
          for permit in result.permits:
              classify_permit(permit)
              kinds[permit.classification]+=1
              if permit.qualifies:
                  qualifying.append(permit)
          print('CLASSIFICATIONS',dict(kinds))
          print('QUALIFYING',len(qualifying))
          for permit in sorted(qualifying,key=lambda p:(p.issued_date,p.permit_number),reverse=True)[:25]:
              print('PERMIT',permit.permit_number,permit.issued_date,permit.classification,permit.project_name,permit.address,permit.valuation,permit.contractor)
          if len(qualifying) < 5:
              raise SystemExit(f'current Nampa report produced unexpectedly few qualifying leads: {len(qualifying)}')
          PY

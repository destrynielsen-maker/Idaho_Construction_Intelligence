name: Post Falls permit source audit

on:
  push:
    branches:
      - add-post-falls-permit-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live Post Falls collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.post_falls import PostFallsPermitCollector

          result=PostFallsPermitCollector().collect()
          print('COUNT',len(result.permits))
          print('NOTE',result.note)
          by_number={p.permit_number:p for p in result.permits}
          required=('BLDC-26-50','BLDR-26-632','BLDR-26-629')
          rejected=('BLDR-26-682','BLDC-26-93')
          for number in required:
              p=by_number.get(number)
              print('CONTROL',number,bool(p),p.permit_type if p else None,p.valuation if p else None)
              if not p:
                  raise SystemExit(f'missing Post Falls control: {number}')
          for number in rejected:
              print('REJECTED',number,number in by_number)
              if number in by_number:
                  raise SystemExit(f'Post Falls noise escaped guard: {number}')
          classes=Counter()
          for p in result.permits:
              classify_permit(p)
              classes[p.classification]+=1
              if not p.qualifies:
                  raise SystemExit(f'Post Falls collector emitted nonqualifying record: {p.permit_number}')
          print('CLASSES',dict(classes))
          if len(result.permits) < 50:
              raise SystemExit(f'Post Falls live count unexpectedly low: {len(result.permits)}')
          PY

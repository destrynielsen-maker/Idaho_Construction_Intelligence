name: Nampa guest search preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/nampa_guest_preview/**'
      - 'src/idaho_permits/collectors/nampa*.py'
      - 'src/idaho_permits/pipeline.py'
      - '.github/workflows/nampa-guest-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'scout/nampa-civic-access-guest-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview-only test dependencies
        run: npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run validation tests
        run: node --test scripts/nampa_guest_preview/probe.test.cjs
      - name: Select a stock Chrome installation
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "NAMPA_USE_SYSTEM_CHROME=1" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium --only-shell
          fi
      - name: Check bounded public search against both known periods
        run: |
          set -euo pipefail
          for period in october november; do
            if [ "$period" = october ]; then
              set -- 10/19/2026 10/23/2026
            else
              set -- 11/23/2026 11/27/2026
            fi
            node scripts/nampa_guest_preview/probe.cjs "$1" "$2" --full > "$RUNNER_TEMP/$period.json"
          done
          node scripts/nampa_guest_preview/accept.cjs "$RUNNER_TEMP/october.json" "$RUNNER_TEMP/november.json"
      - name: Verify isolated live-data integration and repeat
        env:
          PYTHONPATH: src:tests
        run: python scripts/nampa_guest_preview/replay_integration.py . "$RUNNER_TEMP/november.json"
      - name: Verify the actual rolling fallback entry point
        env:
          PYTHONPATH: src:tests
        run: |
          python - <<'PY'
          from datetime import date
          from idaho_permits.collectors.nampa_css import collect_css
          from test_nampa_november_release_gate import EXPECTED
          actual=collect_css(date(2026,11,27))
          got={p.permit_number:(p.issued_date,p.contractor) for p in actual.permits}
          assert {k:got[k] for k in EXPECTED} == EXPECTED and actual.status == 'degraded'
          print("Verified rolling seven-day input; known November permits:",len(EXPECTED))
          PY

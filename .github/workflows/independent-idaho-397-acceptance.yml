name: Independent Idaho read-only release acceptance
on:
  push:
    branches: [independent/idaho-dashboard-release-qa-397]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact candidate atop latest pinned main
        run: |
          python -m pip install -r requirements.txt
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Download exact already-published artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/destrynielsen-maker/Idaho_Construction_Intelligence/actions/artifacts/15177697808/zip > /tmp/qa-pages.zip
      - name: Verify served snapshot against exact archive and pinned generated commit
        run: python qa/verify_idaho_397.py
      - name: Install browser for local candidate smoke test
        if: always()
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Test real dashboard interactions, desktop and mobile
        if: always()
        run: python qa/browser_idaho_44.py

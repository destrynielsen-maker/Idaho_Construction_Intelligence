name: Caldwell collector audit

on:
  push:
    branches:
      - audit-caldwell-compass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live Caldwell collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.caldwell import CaldwellCompassCollector

          result=CaldwellCompassCollector(year=2026).collect()
          print('COUNT',len(result.permits))
          print('NOTE',result.note)
          names={p.project_name for p in result.permits}
          required={
              'Highline Industrial Park Subdivision',
              'North Celeste Subdivision',
              'KCID Commercial Subdivision',
              'Legacy Farm Neighborhood',
              'McAllister Manor Subdivision',
              'Silverleaf Subdivision',
          }
          missing=required-names
          print('MISSING',sorted(missing))
          if missing:
              raise SystemExit(f'missing Caldwell COMPASS controls: {sorted(missing)}')
          if len(result.permits) != 6:
              raise SystemExit(f'expected 6 current Caldwell reviews, got {len(result.permits)}')
          classified={p.project_name:classify_permit(p) for p in result.permits}
          for name in ('Highline Industrial Park Subdivision','KCID Commercial Subdivision'):
              print('QUALIFYING_CONTROL',name,classified[name].classification,classified[name].qualifies)
              if not classified[name].qualifies:
                  raise SystemExit(f'expected qualifying Caldwell control: {name}')
          PY

name: Caldwell collector audit

on:
  push:
    branches:
      - audit-caldwell-compass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect live COMPASS Caldwell shape
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from idaho_permits.collectors.common import get
          from idaho_permits.collectors.caldwell import records_from_page

          url='https://compassidaho.org/development-review-checklists-2026/'
          r=get(url, timeout=60)
          print('HTTP', r.status_code, r.url, len(r.text))
          print('HAS_CALDWELL', 'City of Caldwell' in r.text)
          soup=BeautifulSoup(r.text,'html.parser')
          print('COUNTS', {tag:len(soup.find_all(tag)) for tag in ('h2','h3','h4','h5','table','tr','div','p')})
          for text in soup.find_all(string=lambda s: s and 'City of Caldwell' in s):
              node=text.parent
              print('CALDWELL_NODE', node.name, node.get('class'), repr(' '.join(node.stripped_strings)[:500]))
              parent=node.parent
              if parent:
                  print('PARENT', parent.name, parent.get('class'), repr(' '.join(parent.stripped_strings)[:1200]))
          records=records_from_page(r.text,r.url,2026)
          print('PARSED', len(records), [(p.project_name,p.issued_date,p.source_url) for p in records])
          PY

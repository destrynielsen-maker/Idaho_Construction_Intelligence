name: Eagle collector audit

on:
  push:
    branches:
      - audit-eagle-permit-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect Eagle parser anomalies
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from idaho_permits.collectors.common import get
          from idaho_permits.collectors.eagle import EaglePermitCollector, _lines

          result=EaglePermitCollector().collect()
          print('COUNT',len(result.permits))
          for p in result.permits:
              typ=(p.permit_type or '')
              scope=(p.project_name or '')
              if not typ.lower().startswith(('building','electrical','mechanical','plumbing','water')) or scope.lower() in {'new home','single family dwelling','new residential home'}:
                  print('TARGET',p.permit_number,p.issued_date,repr(typ),p.status,p.address,repr(scope),p.source_url)
                  try:
                      html=get(p.source_url,referer='https://portal.iworq.net/EAGLE/permits/600').text
                      lines=_lines(html)
                      print('DETAIL_LINES',p.permit_number,repr(lines[:90]))
                  except Exception as exc:
                      print('DETAIL_ERROR',p.permit_number,type(exc).__name__,str(exc))
          PY

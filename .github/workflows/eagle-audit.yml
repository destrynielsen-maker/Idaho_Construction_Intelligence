name: Eagle collector audit

on:
  push:
    branches:
      - audit-eagle-permit-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live Eagle collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from idaho_permits.classify import classify_permit
          from idaho_permits.collectors.eagle import EaglePermitCollector

          result=EaglePermitCollector().collect()
          print('SOURCE',result.source)
          print('COUNT',len(result.permits))
          print('NOTE',result.note)
          numbers={p.permit_number for p in result.permits}
          if any(not n.isdigit() for n in numbers):
              raise SystemExit('Eagle collector still contains malformed non-numeric permit numbers')

          required=('267403','267398','267374','267355','267354','267319','267303','267300','267295','267293','267291')
          by_number={p.permit_number:p for p in result.permits}
          qualifying=[]
          kinds=Counter()
          for p in result.permits:
              classify_permit(p)
              kinds[(p.classification,p.qualifies)] += 1
              if p.qualifies: qualifying.append(p)
          for n in required:
              p=by_number.get(n)
              print('CONTROL',n,bool(p),p.permit_type if p else None,p.building_use if p else None,p.contractor if p else None,p.qualifies if p else None)
              if not p or not p.qualifies:
                  raise SystemExit(f'missing Eagle new-home control: {n}')
          if any((p.permit_type or '').lower().startswith(('water ','electrical ','mechanical ','plumbing ')) for p in qualifying):
              raise SystemExit('Eagle trade permit escaped shared trade guard')
          print('CLASSIFICATIONS',dict(kinds))
          print('QUALIFYING_COUNT',len(qualifying))
          for p in sorted(qualifying,key=lambda x:(x.issued_date,x.permit_number),reverse=True):
              print('QUALIFYING',p.permit_number,p.issued_date,p.permit_type,p.status,p.address,repr(p.project_name),repr(p.building_use),p.contractor,p.raw.get('living_area_sqft'))
          if len(qualifying) < len(required):
              raise SystemExit(f'Eagle expected at least {len(required)} qualifying new-home leads, got {len(qualifying)}')
          PY
